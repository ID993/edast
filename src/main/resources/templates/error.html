<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Page</title>
    <!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">-->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.0.1/mdb.min.css"
      rel="stylesheet"
    />
    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.0.1/mdb.min.js"
    ></script>
  </head>

  <body>
    <div class="d-flex align-items-center justify-content-center vh-100">
      <div class="text-center">
        <h1
          class="display-1 fw-bold"
          th:text="${errorStatus != null ? errorStatus : status}"
        >
          500
        </h1>

        <p
          class="fs-3"
          th:text="${errorMessage != null ? errorMessage : (error != null ? error : 'Something went wrong')}"
        >
          Something went wrong
        </p>

        <p
          class="lead"
          th:if="${status == 403 or errorStatus == 403 or errorStatus == '403'}"
        >
          You are not allowed to perform this action.
        </p>

        <p
          class="lead"
          th:if="${status == 404 or errorStatus == 404 or errorStatus == '404'}"
        >
          The page you’re looking for doesn’t exist.
        </p>

        <p
          class="lead"
          th:if="${status == 500 or errorStatus == 500 or errorStatus == '500'}"
        >
          An unexpected server error occurred.
        </p>
        <a th:href="@{/}" class="btn btn-primary">Go Home</a>
      </div>
    </div>
  </body>
</html>
