<!doctype html>
<html
  lang="en"
  xmlns:th="https://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <title>Edit account</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.0.1/mdb.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/datepicker/1.0.10/datepicker.min.css"
    />
    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.0.1/mdb.min.js"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.9.0/dist/css/bootstrap-datepicker.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.9.0/dist/js/bootstrap-datepicker.min.js"></script>

    <script type="text/javascript" th:src="@{/js/dropdown.js}"></script>
    <link th:href="@{/styles/css/dropdown.css}" rel="stylesheet" />
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <section style="background-color: #eee; position: static">
      <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-lg-12 col-xl-11">
            <div class="text-black" style="border-radius: 25px">
              <div class="p-md-5">
                <div class="row justify-content-center">
                  <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
                    <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">
                      Edit Account
                    </p>

                    <form
                      class="mx-1 mx-md-4"
                      th:action="@{/account/edit}"
                      th:object="${user}"
                      method="post"
                    >
                      <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                      />

                      <div class="d-flex flex-row align-items-center mb-4">
                        <i class="fas fa-pencil fa-lg me-3 fa-fw"></i>
                        <div class="form-floating flex-fill mb-0">
                          <input
                            type="text"
                            id="name"
                            class="form-control"
                            th:field="*{name}"
                            required
                            minlength="2"
                            maxlength="255"
                          />
                          <span
                            class="text-warning"
                            th:if="${#fields.hasErrors('name')}"
                            th:errors="*{name}"
                          ></span>
                          <label class="form-label" for="name"
                            >Change name</label
                          >
                        </div>
                      </div>

                      <div class="d-flex flex-row align-items-center mb-4">
                        <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                        <div class="form-floating flex-fill mb-0">
                          <input
                            type="email"
                            id="email"
                            class="form-control"
                            th:value="${email}"
                            readonly
                          />
                          <label class="form-label" for="email">Email</label>
                        </div>
                      </div>

                      <div class="d-flex flex-row align-items-center mb-4">
                        <i class="fas fa-briefcase fa-lg me-3 fa-fw"></i>
                        <div class="form-floating flex-fill mb-0">
                          <input
                            sec:authorize="hasRole('USER')"
                            type="text"
                            id="jobTitle"
                            class="form-control"
                            th:field="*{jobTitle}"
                            maxlength="255"
                          />

                          <input
                            sec:authorize="hasAnyRole('ADMIN', 'EMPLOYEE')"
                            type="text"
                            id="empJobTitle"
                            class="form-control"
                            th:field="*{jobTitle}"
                            readonly
                          />

                          <label
                            sec:authorize="hasRole('USER')"
                            class="form-label"
                            for="jobTitle"
                          >
                            Occupation
                          </label>

                          <label
                            sec:authorize="hasAnyRole('ADMIN', 'EMPLOYEE')"
                            class="form-label"
                            for="empJobTitle"
                          >
                            Job title
                          </label>

                          <span
                            class="text-warning"
                            th:if="${#fields.hasErrors('jobTitle')}"
                            th:errors="*{jobTitle}"
                          ></span>
                        </div>
                      </div>

                      <div class="d-flex flex-row align-items-center mb-4">
                        <i class="fas fa-lock-open fa-lg me-3 fa-fw"></i>
                        <div class="form-floating flex-fill mb-0">
                          <a
                            class="btn btn-outline-primary"
                            th:href="@{/account/change-password}"
                            >Change password</a
                          >
                        </div>
                      </div>

                      <div
                        class="d-flex justify-content-center mx-4 mb-3 mb-lg-4"
                      >
                        <button type="reset" class="btn btn-light btn-lg">
                          Reset
                        </button>
                        <button type="submit" class="btn btn-primary btn-lg">
                          Update
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
