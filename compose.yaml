services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: edastdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edast-local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - edast-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edastdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  edast-postgres-data: